name: Backend deploy and promotion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, test, prod]
      sha:
        description: Exact 40-character backend commit SHA already proven in the previous stage
        required: true
        type: string
      operation:
        description: Deploy dev, promote from the previous stage, or redeploy a same-stage rollback
        required: true
        type: choice
        options: [deploy, promote, rollback]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.release.outputs.stage }}
      sha: ${{ steps.release.outputs.sha }}
      operation: ${{ steps.release.outputs.operation }}
    steps:
      - id: release
        name: Resolve immutable release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            STAGE=dev
            SHA="$EVENT_SHA"
            OPERATION=deploy
          else
            STAGE="$INPUT_STAGE"
            SHA="${INPUT_SHA,,}"
            OPERATION="$INPUT_OPERATION"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character commit SHA is required; branches such as main are forbidden." >&2
            exit 1
          fi
          case "${OPERATION}:${STAGE}" in
            deploy:dev|promote:test|promote:prod|rollback:dev|rollback:test|rollback:prod) ;;
            deploy:*)
              echo "Manual deploy is allowed only for dev." >&2
              exit 1
              ;;
            promote:*)
              echo "Promotion is allowed only for test or prod." >&2
              exit 1
              ;;
            *)
              echo "Unsupported operation/stage combination: ${OPERATION}:${STAGE}" >&2
              exit 1
              ;;
          esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: read
      id-token: write
    needs: prepare
    if: >-
      ${{
        needs.prepare.result == 'success' &&
        (
          (
            needs.prepare.outputs.operation == 'rollback' &&
            vars.AWS_ROLLBACK_ENABLED == 'true' &&
            vars.AWS_DEPLOY_ENABLED == 'false'
          ) ||
          (
            needs.prepare.outputs.operation != 'rollback' &&
            vars.AWS_DEPLOY_ENABLED == 'true' &&
            vars.AWS_ROLLBACK_ENABLED == 'false'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ${{ needs.prepare.outputs.stage }}
    concurrency:
      group: backend-${{ needs.prepare.outputs.stage }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: roadmap2u-backend
    env:
      AWS_REGION: us-east-1
      STAGE: ${{ needs.prepare.outputs.stage }}
      SHA: ${{ needs.prepare.outputs.sha }}
      OPERATION: ${{ needs.prepare.outputs.operation }}
      TRIGGER_EVENT: ${{ github.event_name }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
    steps:
      - name: Confirm mutually exclusive deployment gate
        env:
          AWS_DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          AWS_ROLLBACK_ENABLED: ${{ vars.AWS_ROLLBACK_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "rollback" ]]; then
            if [[ "$AWS_DEPLOY_ENABLED" != "false" || "$AWS_ROLLBACK_ENABLED" != "true" ]]; then
              echo "Exactly one of AWS_DEPLOY_ENABLED or AWS_ROLLBACK_ENABLED must be true, and rollback requires AWS_ROLLBACK_ENABLED." >&2
              exit 1
            fi
          elif [[ "$AWS_DEPLOY_ENABLED" != "true" || "$AWS_ROLLBACK_ENABLED" != "false" ]]; then
            echo "Exactly one of AWS_DEPLOY_ENABLED or AWS_ROLLBACK_ENABLED must be true, and deploy/promote requires AWS_DEPLOY_ENABLED." >&2
            exit 1
          fi
        working-directory: .

      - name: Checkout immutable backend release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          path: roadmap2u-backend

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SHA"
          git cat-file -e "${SHA}^{commit}"
          if [[ "$TRIGGER_EVENT" == "workflow_dispatch" && "$STAGE" == "dev" && "$OPERATION" == "deploy" ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            test "$SHA" = "$(git rev-parse refs/remotes/origin/main)"
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roadmap2u-backend/package-lock.json

      - name: Resolve pinned frontend contract source
        id: contract-source
        run: node scripts/verify-contract-source.mjs resolve --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned frontend contract source
        if: ${{ needs.prepare.outputs.operation == 'deploy' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Toydrum/RoadMap2U
          ref: ${{ steps.contract-source.outputs.commit_sha }}
          path: RoadMap2U

      - name: Verify pinned frontend contract source
        if: ${{ needs.prepare.outputs.operation == 'deploy' }}
        run: >-
          node scripts/verify-contract-source.mjs verify
          --frontend-root "${GITHUB_WORKSPACE}/RoadMap2U"

      - name: Validate release
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          if [[ "$OPERATION" != "deploy" ]]; then
            npm test -- --exclude test/contracts-parity.test.ts
          else
            npm run contracts:check
            ROADMAP2U_FRONTEND_PATH="${GITHUB_WORKSPACE}/RoadMap2U" npm test
          fi

      - name: Validate and mask alarm notification email
        env:
          ALARM_NOTIFICATION_EMAIL: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$ALARM_NOTIFICATION_EMAIL" || ${#ALARM_NOTIFICATION_EMAIL} -gt 254 || ! "$ALARM_NOTIFICATION_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "ALARM_NOTIFICATION_EMAIL is missing or invalid." >&2
            exit 1
          fi
          echo "::add-mask::$ALARM_NOTIFICATION_EMAIL"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: backend-${{ needs.prepare.outputs.stage }}-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS account and promotion proof
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID"

          if [[ "$OPERATION" == "promote" ]]; then
            if [[ "$STAGE" == "test" ]]; then PREVIOUS=dev; else PREVIOUS=test; fi
            PROOF="$(aws ssm get-parameter --name "/roadmap2u/${PREVIOUS}/backend-releases/${SHA}" --query Parameter.Value --output text)"
            test "$PROOF" = "$SHA"
          elif [[ "$OPERATION" == "rollback" ]]; then
            PROOF="$(aws ssm get-parameter --name "/roadmap2u/${STAGE}/backend-releases/${SHA}" --query Parameter.Value --output text)"
            test "$PROOF" = "$SHA"
          fi

      - name: Validate pre-deploy CloudFormation states
        run: |
          set -euo pipefail
          for STACK in "Roadmap-${STAGE}-Backend" "Roadmap-${STAGE}-Hosting"; do
            if aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --output json > predeploy-stack.json 2> predeploy-stack.err; then
              STATUS="$(jq -er 'if (.Stacks | length) == 1 then .Stacks[0].StackStatus else error("expected exactly one stack") end' predeploy-stack.json)"
              case "$STATUS" in
                CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
                *)
                  echo "Refusing to deploy over $STACK in state $STATUS." >&2
                  exit 1
                  ;;
              esac
            elif grep --quiet 'ValidationError' predeploy-stack.err && grep --quiet 'does not exist' predeploy-stack.err; then
              echo "$STACK does not exist; first deployment is allowed."
            else
              cat predeploy-stack.err >&2
              exit 1
            fi
          done

      - name: Review CDK diff
        env:
          ALARM_NOTIFICATION_EMAIL: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
        run: >-
          npx --no-install cdk diff
          "Roadmap-${STAGE}-Backend" "Roadmap-${STAGE}-Hosting"
          --fail=false
          -c stage="${STAGE}"
          -c AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
          -c HOSTED_ZONE_ID="${HOSTED_ZONE_ID}"
          --parameters "Roadmap-${STAGE}-Backend:AlarmNotificationEmail=${ALARM_NOTIFICATION_EMAIL}"

      - name: Deploy selected stage
        env:
          ALARM_NOTIFICATION_EMAIL: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
        run: >-
          npx --no-install cdk deploy
          "Roadmap-${STAGE}-Backend" "Roadmap-${STAGE}-Hosting"
          --require-approval never
          -c stage="${STAGE}"
          -c AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
          -c HOSTED_ZONE_ID="${HOSTED_ZONE_ID}"
          --parameters "Roadmap-${STAGE}-Backend:AlarmNotificationEmail=${ALARM_NOTIFICATION_EMAIL}"

      - name: Validate deployed stacks and public configuration
        run: |
          set -euo pipefail
          for STACK in "Roadmap-${STAGE}-Backend" "Roadmap-${STAGE}-Hosting"; do
            STATUS="$(aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].StackStatus' --output text)"
            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) ;;
              *)
                echo "$STACK did not finish in an accepted success state: $STATUS" >&2
                exit 1
                ;;
            esac
            aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].Outputs[].{Key:OutputKey,Value:OutputValue}' --output table
          done

          aws ssm get-parameters --names \
            "/roadmap2u/${STAGE}/region" \
            "/roadmap2u/${STAGE}/user-pool-id" \
            "/roadmap2u/${STAGE}/user-pool-client-id" \
            "/roadmap2u/${STAGE}/api-base-url" \
            "/roadmap2u/${STAGE}/frontend-bucket" \
            "/roadmap2u/${STAGE}/cloudfront-distribution-id" \
            "/roadmap2u/${STAGE}/frontend-url" \
            "/roadmap2u/${STAGE}/contract-hash" \
            --output json > deployed-config.json
          jq -e '
            (.InvalidParameters | length) == 0 and
            (.Parameters | length) == 8 and
            all(.Parameters[]; (.Value | type) == "string" and (.Value | length) > 0)
          ' deployed-config.json >/dev/null

          parameter() {
            jq -r --arg name "/roadmap2u/${STAGE}/$1" '.Parameters[] | select(.Name == $name) | .Value' deployed-config.json
          }
          test "$(parameter region)" = "us-east-1"
          API_BASE_URL="$(parameter api-base-url)"
          FRONTEND_URL="$(parameter frontend-url)"
          test "${API_BASE_URL%/v1}" = "$API_BASE_URL"
          test "$API_BASE_URL" = "https://$([[ $STAGE == prod ]] && echo api.roadmap2u.com || echo api.$STAGE.roadmap2u.com)"
          test "$FRONTEND_URL" = "https://$([[ $STAGE == prod ]] && echo roadmap2u.com || echo $STAGE.roadmap2u.com)"
          test "$(parameter frontend-bucket)" = "roadmap2u-${STAGE}-${AWS_ACCOUNT_ID}"
          test "$(parameter contract-hash)" = "$(npm run --silent contracts:hash)"
          jq -r '.Parameters[] | [.Name, .Value] | @tsv' deployed-config.json

      - name: Validate application log retention
        run: |
          set -euo pipefail
          case "$STAGE" in
            dev) EXPECTED_LOG_RETENTION=7 ;;
            test) EXPECTED_LOG_RETENTION=14 ;;
            prod) EXPECTED_LOG_RETENTION=30 ;;
            *) exit 2 ;;
          esac
          LOG_GROUPS=(
            "/aws/lambda/roadmap-pre-signup-${STAGE}"
            "/aws/lambda/roadmap-post-confirmation-${STAGE}"
            "/aws/lambda/roadmap-router-${STAGE}"
            "/aws/apigateway/roadmap-api-${STAGE}"
          )
          for LOG_GROUP in "${LOG_GROUPS[@]}"; do
            aws logs describe-log-groups \
              --log-group-name-prefix "$LOG_GROUP" \
              --output json > log-groups.json
            jq -e \
              --arg name "$LOG_GROUP" \
              --argjson retention "$EXPECTED_LOG_RETENTION" '
                [.logGroups[] | select(.logGroupName == $name)] as $matches |
                ($matches | length) == 1 and
                $matches[0].retentionInDays == $retention
              ' log-groups.json >/dev/null
          done

      - name: Verify commercial alarm channel
        env:
          ALARM_NOTIFICATION_EMAIL: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
        run: |
          set -euo pipefail
          TOPIC_ARN="arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:roadmap-commercial-alerts-${STAGE}"
          ALARM_NAME="roadmap-commercial-${STAGE}-synthetic"
          SUBSCRIPTIONS="$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC_ARN" --output json)"
          jq -e --arg email "$ALARM_NOTIFICATION_EMAIL" '
            (.Subscriptions | length) == 1 and
            .Subscriptions[0].Protocol == "email" and
            .Subscriptions[0].Endpoint == $email and
            .Subscriptions[0].SubscriptionArn != "PendingConfirmation"
          ' <<<"$SUBSCRIPTIONS" >/dev/null

          aws cloudwatch set-alarm-state \
            --alarm-name "$ALARM_NAME" \
            --state-value ALARM \
            --state-reason "RoadMap2U deployment synthetic notification check"
          for ATTEMPT in {1..12}; do
            STATE="$(aws cloudwatch describe-alarms \
              --alarm-names "$ALARM_NAME" \
              --query 'MetricAlarms[0].StateValue' \
              --output text)"
            if [[ "$STATE" == "ALARM" ]]; then break; fi
            sleep 5
          done
          test "$STATE" = "ALARM"
          sleep 15
          aws cloudwatch set-alarm-state \
            --alarm-name "$ALARM_NAME" \
            --state-value OK \
            --state-reason "RoadMap2U deployment synthetic notification check completed"

      - name: Smoke-test protected API and exact CORS allowlist
        run: |
          set -euo pipefail
          API_BASE_URL="$(jq -r --arg name "/roadmap2u/${STAGE}/api-base-url" '.Parameters[] | select(.Name == $name) | .Value' deployed-config.json)"
          if [[ "$STAGE" == prod ]]; then
            ALLOWED_ORIGINS=("https://roadmap2u.com")
          else
            ALLOWED_ORIGINS=("https://$STAGE.roadmap2u.com" "http://localhost:4200" "http://localhost:8826")
          fi

          API_TLS_READY=false
          for ATTEMPT in {1..36}; do
            if curl --silent --output /dev/null --connect-timeout 2 --max-time 4 \
              "${API_BASE_URL}/v1/me"; then
              API_TLS_READY=true
              break
            fi
            echo "Waiting for API custom-domain TLS propagation (${ATTEMPT}/36)." >&2
            sleep 5
          done
          if ! test "$API_TLS_READY" = "true"; then
            curl --silent --show-error --output /dev/null --connect-timeout 2 --max-time 4 \
              "${API_BASE_URL}/v1/me" || true
            echo "API custom-domain TLS did not become ready after 36 attempts." >&2
            exit 1
          fi

          for ORIGIN in "${ALLOWED_ORIGINS[@]}"; do
            STATUS="$(curl --silent --show-error --output /dev/null --dump-header preflight.headers --write-out '%{http_code}' \
              --request OPTIONS \
              --header "Origin: $ORIGIN" \
              --header 'Access-Control-Request-Method: GET' \
              "${API_BASE_URL}/v1/me")"
            test "$STATUS" = "204"
            tr -d '\r' < preflight.headers |
              grep --ignore-case --fixed-strings --line-regexp --quiet "access-control-allow-origin: $ORIGIN"
          done

          curl --silent --show-error --output /dev/null --dump-header rejected.headers \
            --request OPTIONS \
            --header 'Origin: https://not-roadmap2u.example' \
            --header 'Access-Control-Request-Method: GET' \
            "${API_BASE_URL}/v1/me"
          ! grep --ignore-case --quiet '^access-control-allow-origin:' rejected.headers

          PRIMARY_ORIGIN="${ALLOWED_ORIGINS[0]}"
          STATUS="$(curl --silent --show-error --output response.json --dump-header response.headers --write-out '%{http_code}' \
            --header "Origin: $PRIMARY_ORIGIN" \
            "${API_BASE_URL}/v1/me")"
          test "$STATUS" = "401"
          grep --ignore-case --quiet '^content-type: application/json' response.headers
          tr -d '\r' < response.headers |
            grep --ignore-case --fixed-strings --line-regexp --quiet "access-control-allow-origin: $PRIMARY_ORIGIN"
          jq -e '.message | type == "string"' response.json >/dev/null

      - name: Publish immutable backend release manifest
        run: |
          set -euo pipefail
          jq --compact-output --sort-keys \
            --slurpfile contractSource shared/contracts-source.json \
            --arg prefix "/roadmap2u/${STAGE}/" \
            --arg stage "$STAGE" \
            --arg sha "$SHA" '
              def parameter($leaf):
                [.Parameters[] | select(.Name == ($prefix + $leaf)) | .Value] as $values |
                if (($values | length) == 1 and
                    ($values[0] | type) == "string" and
                    ($values[0] | length) > 0)
                then $values[0]
                else error("missing or duplicate handoff parameter: " + $leaf)
                end;
              {
                schemaVersion: 1,
                stage: $stage,
                backendReleaseSha: $sha,
                contractSource: $contractSource[0],
                handoff: {
                  region: parameter("region"),
                  userPoolId: parameter("user-pool-id"),
                  userPoolClientId: parameter("user-pool-client-id"),
                  apiBaseUrl: parameter("api-base-url"),
                  frontendBucket: parameter("frontend-bucket"),
                  cloudFrontDistributionId: parameter("cloudfront-distribution-id"),
                  frontendUrl: parameter("frontend-url"),
                  contractHash: parameter("contract-hash")
                }
              }
            ' deployed-config.json > backend-release-manifest.json

          jq -e \
            --slurpfile contractSource shared/contracts-source.json \
            --arg stage "$STAGE" \
            --arg sha "$SHA" '
              .schemaVersion == 1 and
              .stage == $stage and
              .backendReleaseSha == $sha and
              .contractSource == $contractSource[0] and
              (.contractSource | keys) == [
                "commitSha",
                "contractHash",
                "repository",
                "schemaVersion"
              ] and
              .contractSource.schemaVersion == 1 and
              .contractSource.repository == "Toydrum/RoadMap2U" and
              (.contractSource.commitSha | test("^[0-9a-f]{40}$")) and
              (.contractSource.contractHash | test("^[0-9a-f]{64}$")) and
              .contractSource.contractHash == .handoff.contractHash and
              (.handoff | keys) == [
                "apiBaseUrl",
                "cloudFrontDistributionId",
                "contractHash",
                "frontendBucket",
                "frontendUrl",
                "region",
                "userPoolClientId",
                "userPoolId"
              ] and
              all(.handoff[]; type == "string" and length > 0)
            ' backend-release-manifest.json >/dev/null
          MANIFEST_BYTES="$(wc -c < backend-release-manifest.json)"
          test "$MANIFEST_BYTES" -le 4096

          MANIFEST_NAME="/roadmap2u/${STAGE}/backend-release-manifests/${SHA}"
          MANIFEST_VALUE="$(cat backend-release-manifest.json)"
          if aws ssm get-parameter \
            --name "$MANIFEST_NAME" \
            --output json > existing-manifest.json 2> existing-manifest.err; then
            EXISTING_VALUE="$(jq -r '.Parameter.Value' existing-manifest.json)"
            EXISTING_CANONICAL="$(printf '%s' "$EXISTING_VALUE" | jq --compact-output --sort-keys .)"
            test "$EXISTING_CANONICAL" = "$MANIFEST_VALUE"
          elif grep --quiet 'ParameterNotFound' existing-manifest.err; then
            aws ssm put-parameter \
              --name "$MANIFEST_NAME" \
              --type String \
              --value "$MANIFEST_VALUE"
          else
            cat existing-manifest.err >&2
            exit 1
          fi

      - name: Record exact successful backend SHA
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "/roadmap2u/${STAGE}/backend-releases/${SHA}" --type String --value "$SHA" --overwrite
          aws ssm put-parameter --name "/roadmap2u/${STAGE}/backend-release-sha" --type String --value "$SHA" --overwrite
