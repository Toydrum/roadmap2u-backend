name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: roadmap2u-backend
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: roadmap2u-backend

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roadmap2u-backend/package-lock.json

      - name: Use the pinned npm version
        run: npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund

      - name: Verify the npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Resolve pinned frontend contract source
        id: contract-source
        run: node scripts/verify-contract-source.mjs resolve --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned frontend contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Toydrum/RoadMap2U
          ref: ${{ steps.contract-source.outputs.commit_sha }}
          path: RoadMap2U

      - name: Verify pinned frontend contract source
        run: >-
          node scripts/verify-contract-source.mjs verify
          --frontend-root "${GITHUB_WORKSPACE}/RoadMap2U"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify vendored contracts
        run: npm run contracts:check
        env:
          ROADMAP2U_FRONTEND_PATH: ${{ github.workspace }}/RoadMap2U

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          ROADMAP2U_FRONTEND_PATH: ${{ github.workspace }}/RoadMap2U

      - name: Synthesize dev
        run: npx --no-install cdk synth --quiet -c stage=dev -c AWS_ACCOUNT_ID=000000000000 -c HOSTED_ZONE_ID=Z0000000000000

      - name: Synthesize test
        run: npx --no-install cdk synth --quiet -c stage=test -c AWS_ACCOUNT_ID=000000000000 -c HOSTED_ZONE_ID=Z0000000000000

      - name: Synthesize prod
        run: npx --no-install cdk synth --quiet -c stage=prod -c AWS_ACCOUNT_ID=000000000000 -c HOSTED_ZONE_ID=Z0000000000000
